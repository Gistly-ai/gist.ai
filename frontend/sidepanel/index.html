<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" type="text/css" href="index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Comic+Neue:wght@700&display=swap"
      rel="stylesheet"
    />
    <script src="index.js"></script>
  </head>
  <body>
    <div
      class="nav-bar"
      style="
        background: linear-gradient(to right, #ffffff, #f0f0f0);
        display: flex;
        justify-content: space-between;
      "
    >
      <button class="profile-btn">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </button>
      <button class="play-btn">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </button>
    </div>

    <div id="content">
      <div class="loading-container">
        <div class="loading-text">Hang tight mate! Squeezing out the Gist...</div>
        <div class="loader-container">
          <div class="fist">
            <div class="palm"></div>
            <div class="knuckle k1"></div>
            <div class="knuckle k2"></div>
            <div class="knuckle k3"></div>
            <div class="knuckle k4"></div>
            <div class="thumb"></div>
          </div>
          <div class="orange"></div>
          <div class="juice-drop1"></div>
          <div class="juice-drop2"></div>
          <div class="juice-drop3"></div>
          <div class="glass">
            <div class="juice-level"></div>
            <div class="splash"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
